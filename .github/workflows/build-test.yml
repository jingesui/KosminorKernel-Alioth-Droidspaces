name: Build Test (Droidspaces)
on:
  workflow_dispatch:
  push:
    branches:
      - hyper-2

jobs:
  build:
    name: Build KosminorKernel with Droidspaces configs
    runs-on: ubuntu-24.04
    steps:

      - name: Set Beijing timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Shanghai"

      - name: Set SWAP to 5GiB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Initialize Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install git automake build-essential bc -y
          
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: hyper-2
          fetch-depth: 1

      - name: Get Toolchain
        run: |
          git clone https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone.git --depth 1 toolchain/llvm
          git clone https://github.com/KopsourcesORG/python-2.7.18-prebuilt.git --depth=1 toolchain/python2

      - name: Processing submodules
        run: |
          git submodule update --init --recursive android/Installer
          git submodule update --init --recursive Baseband-guard
          git submodule update --init --recursive KernelSU
          cd KernelSU
          git fetch --tags
          LATEST_TAG=$(git tag -l | sort -V | tail -n1)
          echo "Latest KernelSU tag: $LATEST_TAG"
          git checkout $LATEST_TAG

      - name: Integrate KernelSU into build system
        run: |
          echo "=== Remove symlink, copy real directory instead ==="
          rm -f drivers/kernelsu
          cp -ra KernelSU/kernel drivers/kernelsu
          echo "=== Verify integration ==="
          test -f drivers/kernelsu/Kconfig && echo "Kconfig: OK"
          test -f drivers/kernelsu/Makefile && echo "Makefile: OK"
          grep -q 'source.*kernelsu/Kconfig' drivers/Kconfig && echo "Kconfig ref: OK"
          grep -q 'obj.*kernelsu/' drivers/Makefile && echo "Makefile ref: OK"
          ls drivers/kernelsu/

      - name: Verify Droidspaces configs
        run: |
          echo "=== Droidspaces config check ==="
          for cfg in CONFIG_PID_NS=y CONFIG_DEVTMPFS=y CONFIG_CGROUP_DEVICE=y \
                     CONFIG_OVERLAY_FS=y CONFIG_NET_NS=y CONFIG_VETH=y; do
            if grep -q "$cfg" arch/arm64/configs/alioth_kosminor_defconfig; then
              echo "  OK  $cfg"
            else
              echo "  MISSING  $cfg"
            fi
          done

      - name: Add KSU configs
        run: |
          sed -i -e '$a\'$'\n''CONFIG_KSU=y\nCONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y' arch/arm64/configs/alioth_kosminor_defconfig
          echo "=== Disable KSU LSM hooks (may cause bootloop) ==="
          echo "# CONFIG_KSU_LSM_SECURITY_HOOKS is not set" >> arch/arm64/configs/alioth_kosminor_defconfig
          echo "=== KSU configs appended ==="
          tail -5 arch/arm64/configs/alioth_kosminor_defconfig

      - name: Build Kernel
        run: |
          export LOCALVERSION="-perf-g92c089fc2d37"
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          export ARCH="arm64"
          export SUBARCH="arm64"
          export PATH="$GITHUB_WORKSPACE/toolchain/llvm/bin:$GITHUB_WORKSPACE/toolchain/python2/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/llvm/lib64:$GITHUB_WORKSPACE/toolchain/python2/lib:$LD_LIBRARY_PATH"
          export KBUILD_COMPILER_STRING=$(clang --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
          export KBUILD_LINKER_STRING=$(ld.lld --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//' | sed 's/(compatible with [^)]*)//')
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-android-"
          make O=out alioth_kosminor_defconfig
          echo "=== CONFIG_KSU in .config ==="
          grep CONFIG_KSU out/.config || echo "WARNING: CONFIG_KSU NOT in .config!"
          make -j$(nproc --all) O=out 2>&1

      - name: Package AnyKernel3
        run: |
          echo "=== Clone AnyKernel3 template ==="
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 ak3
          echo "=== Copy kernel files ==="
          cp out/arch/arm64/boot/Image ak3/
          cp out/arch/arm64/boot/Image.gz ak3/ 2>/dev/null || true
          # Concatenate all dtbs for sm8250
          cat out/arch/arm64/boot/dts/vendor/qcom/*.dtb > ak3/dtb 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img ak3/ 2>/dev/null || true
          echo "=== Write anykernel.sh ==="
          {
            echo "# AnyKernel3 - Alioth (POCO F3 / Redmi K40)"
            echo "kernel=Image"
            echo "kernelcomp=gz"
            echo "device.name1=alioth"
            echo "device.name2=aliothin"
            echo "supported.versions=11-13"
            echo "supported.patchlevels="
            echo "supported.vendorpatchlevels="
            echo "block=boot"
            echo "is_slot_device=auto"
            echo "ramdisk_compression=auto"
          } > ak3/anykernel.sh
          echo "=== Create flashable ZIP ==="
          cd ak3
          zip -r9 "../KosminorKernel-Alioth-Droidspaces-$(date +%Y%m%d).zip" * -x ".git/*" -x "README.md"
          cd ..
          ls -lh *.zip

      - name: Upload Raw Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KosminorKernel_Alioth_Droidspaces_raw
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
            out/arch/arm64/boot/dtbo.img
            out/vmlinux
            out/System.map

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KosminorKernel_Alioth_Droidspaces_AK3
          path: ./*.zip
